spring:
  application:
    name: tournax-api
  datasource:
    # JDBC host only (no user/password in URL — @ in password breaks jdbc:…//user:pass@host).
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      data-source-properties:
        # Supabase's connection pooler (PgBouncer, transaction mode) doesn't support server-side
        # prepared statements across pooled connections — this disables pgjdbc's prepared
        # statement caching so Flyway/Hibernate don't intermittently hit "prepared statement
        # already exists" / "does not exist" errors on connection handoff.
        prepareThreshold: 0
  jpa:
    hibernate:
      # Flyway owns the schema — never use update/create here
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:${BREVO_SMTP_LOGIN:}}
    password: ${MAIL_PASSWORD:${BREVO_SMTP_KEY:}}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 8000
          timeout: 8000
          writetimeout: 8000
          starttls:
            enable: true

server:
  port: ${PORT:8080}

tournax:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  registration:
    honeypot-field: website
    otp-expiry-minutes: 30
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:TOURNAX <onboarding@resend.dev>}
    resend-api-key: ${RESEND_API_KEY:}
    # Prefer BREVO_API_KEY on cloud hosts — outbound SMTP (587) is often blocked.
    # auto | live | console — auto sends for real when RESEND_API_KEY or SMTP is set
    delivery: ${MAIL_DELIVERY:auto}
  admin:
    api-key: ${ADMIN_API_KEY:dev-admin-change-me}
