<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Semi-finals preview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;display=swap">
<style>
@font-face{font-family:"Furore";src:url(/_blob/6ee480781b6660a899e00b3ad8dfe437) format("opentype");font-display:block}
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1080px; height: 1350px; box-sizing: border-box; overflow: hidden; background: #1E0825; color: #F3F0EA; font-family: Onest, sans-serif; padding: 64px 72px 56px; display: flex; flex-direction: column; gap: 40px;">

<div aria-hidden="true" style="position: absolute; top: -260px; right: -220px; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(153,56,212,0.42) 0%, rgba(153,56,212,0.12) 45%, rgba(30,8,37,0) 70%);"></div>
<div aria-hidden="true" style="position: absolute; bottom: -300px; left: -260px; width: 760px; height: 760px; border-radius: 50%; background: radial-gradient(circle, rgba(222,208,2,0.14) 0%, rgba(30,8,37,0) 65%);"></div>
<img src="/_blob/66412913ef9dc238a66b81142f8d8e9a" alt="" aria-hidden="true" style="position: absolute; top: 70px; right: -40px; width: 360px; height: auto; opacity: 0.22;">

<header style="position: relative; display: flex; align-items: flex-start; justify-content: space-between; gap: 24px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<span style="font-family: Furore, sans-serif; font-size: 40px; line-height: 1; letter-spacing: 0.02em;">TOURNAX</span>
<span style="font-size: 18px; font-weight: 700; letter-spacing: 0.24em; color: #DED002;">PESISM 2.0</span>
</div>
<span style="background: #830D5C; color: #F3F0EA; font-size: 18px; font-weight: 700; letter-spacing: 0.16em; padding: 12px 22px; border-radius: 999px;">KNOCKOUTS</span>
</header>

<section style="position: relative; display: flex; flex-direction: column; gap: 16px;">
<span style="font-family: Furore, sans-serif; font-size: 112px; line-height: 0.9;">SEMI<br><span style="color: #DED002;">FINALS</span></span>
<p style="margin: 0; display: flex; align-items: center; gap: 14px; font-size: 24px; font-weight: 600; color: #CBB8D9;">
<span style="width: 12px; height: 12px; border-radius: 50%; background: #DED002;"></span>
Four left. Two make the final · Play by Sun, 25 Jan · 11:59 PM IST
</p>
</section>

<section style="position: relative; flex: 1; display: flex; flex-direction: column; gap: 16px;">
<sc-for list="{{ties}}" as="t" hint-placeholder-count="2">
<div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; background: #27092F; border: 1px solid rgba(243,240,234,0.12); border-radius: 24px; padding: 24px;">
<span style="font-size: 15px; font-weight: 800; letter-spacing: 0.18em; color: #9E84AE;">{{t.label}}</span>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 20px;">

<div style="display: flex; align-items: center; gap: 20px; min-width: 0; flex: 1;">
<div style="position: relative; flex: none; width: 176px; height: 220px; border-radius: 20px; overflow: hidden; background: linear-gradient(180deg, #341040, #1E0825); border: 1px solid rgba(243,240,234,0.12); display: flex; align-items: flex-end; justify-content: center;">
<svg width="120" height="140" viewBox="0 0 120 140" aria-hidden="true"><circle cx="60" cy="48" r="28" fill="#4A1C58"></circle><path d="M8 140c4-38 26-58 52-58s48 20 52 58z" fill="#4A1C58"></path></svg>
<span style="position: absolute; top: 12px; left: 0; right: 0; text-align: center; font-size: 11px; font-weight: 800; letter-spacing: 0.16em; color: #9E84AE;">PLAYER PHOTO</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; min-width: 0;">
<svg width="52" height="61" viewBox="0 0 72 84" aria-hidden="true">
<path d="M36 2 68 12v28c0 20-14 34-32 42C18 74 4 60 4 40V12z" fill="{{t.h.c1}}" stroke="#F3F0EA" stroke-opacity="0.35" stroke-width="2"></path>
<path d="M36 2 68 12v8H4v-8z" fill="{{t.h.c2}}"></path>
<text x="36" y="56" text-anchor="middle" font-family="Furore, sans-serif" font-size="18" fill="{{t.h.ink}}">{{t.h.short}}</text>
</svg>
<span style="font-family: Furore, sans-serif; font-size: 28px; line-height: 1.05;">{{t.h.team}}</span>
<span style="font-size: 20px; font-weight: 500; color: #CBB8D9;">{{t.h.player}}</span>
</div>
</div>

<div style="flex: none; width: 76px; height: 76px; border-radius: 50%; background: #DED002; color: #1E0825; display: flex; align-items: center; justify-content: center; font-family: Furore, sans-serif; font-size: 26px;">VS</div>

<div style="display: flex; align-items: center; justify-content: flex-end; gap: 20px; min-width: 0; flex: 1; text-align: right;">
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 10px; min-width: 0;">
<svg width="52" height="61" viewBox="0 0 72 84" aria-hidden="true">
<path d="M36 2 68 12v28c0 20-14 34-32 42C18 74 4 60 4 40V12z" fill="{{t.a.c1}}" stroke="#F3F0EA" stroke-opacity="0.35" stroke-width="2"></path>
<path d="M36 2 68 12v8H4v-8z" fill="{{t.a.c2}}"></path>
<text x="36" y="56" text-anchor="middle" font-family="Furore, sans-serif" font-size="18" fill="{{t.a.ink}}">{{t.a.short}}</text>
</svg>
<span style="font-family: Furore, sans-serif; font-size: 28px; line-height: 1.05;">{{t.a.team}}</span>
<span style="font-size: 20px; font-weight: 500; color: #CBB8D9;">{{t.a.player}}</span>
</div>
<div style="position: relative; flex: none; width: 176px; height: 220px; border-radius: 20px; overflow: hidden; background: linear-gradient(180deg, #341040, #1E0825); border: 1px solid rgba(243,240,234,0.12); display: flex; align-items: flex-end; justify-content: center;">
<svg width="120" height="140" viewBox="0 0 120 140" aria-hidden="true"><circle cx="60" cy="48" r="28" fill="#4A1C58"></circle><path d="M8 140c4-38 26-58 52-58s48 20 52 58z" fill="#4A1C58"></path></svg>
<span style="position: absolute; top: 12px; left: 0; right: 0; text-align: center; font-size: 11px; font-weight: 800; letter-spacing: 0.16em; color: #9E84AE;">PLAYER PHOTO</span>
</div>
</div>

</div>
</div>
</sc-for>
</section>

<footer style="position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding-top: 24px; border-top: 1px solid rgba(243,240,234,0.12);">
<p style="margin: 0; font-family: Furore, sans-serif; font-size: 26px; line-height: 1.15; max-width: 560px;">The group chat ends here.<br><span style="color: #DED002;">The pitch decides.</span></p>
<span style="font-size: 20px; font-weight: 600; color: #9E84AE;">tournax.auradev.in</span>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      acm: { team: 'AC Milan', short: 'ACM', c1: '#C8102E', c2: '#111111', ink: '#FFFFFF' },
      liv: { team: 'Liverpool', short: 'LIV', c1: '#C8102E', c2: '#00B2A9', ink: '#FFFFFF' },
      bar: { team: 'Barcelona', short: 'BAR', c1: '#A50044', c2: '#004D98', ink: '#FFFFFF' },
      int: { team: 'Inter', short: 'INT', c1: '#0068A8', c2: '#111111', ink: '#FFFFFF' },
    };
    const s = (k, player) => ({ ...T[k], player });
    const ties = [
      { label: 'SF1 · WINNER QF1 v WINNER QF4', h: s('acm', 'Adhil'), a: s('bar', 'Nikhil') },
      { label: 'SF2 · WINNER QF2 v WINNER QF3', h: s('int', 'Jouhar'), a: s('liv', 'Faiz') },
    ];
    return { ties };
  }
}
</script>
</body>
</html>
